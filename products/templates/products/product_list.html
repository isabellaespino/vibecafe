<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vibecafe</title>
</head>
<body>
    <h1>Menu</h1>
    <ul>
        {% for product in products %}
        <li>{{ product.name }} &mdash; ${{ product.price }}</li>
        {% empty %}
        <li>No products yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
